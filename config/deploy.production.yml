# Production: https://app.felegeyordanos.org, deployed on every push to main.
# Same server as staging, separate app container, database and volumes.
# Behind Cloudflare (proxied, SSL mode "Full (strict)"); kamal-proxy serves
# the Cloudflare origin certificate (*.felegeyordanos.org covers app.).

proxy:
  host: app.felegeyordanos.org
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY

env:
  clear:
    BETTER_AUTH_URL: https://app.felegeyordanos.org
    # Email through Brevo (SMTP relay, STARTTLS). SMTP_USER and SMTP_PASSWORD
    # are secrets (config/deploy.yml, .kamal/secrets.<destination>).
    EMAIL_TRANSPORT: smtp
    SMTP_HOST: smtp-relay.brevo.com
    SMTP_PORT: "587"
    EMAIL_FROM: Felege Yordanos <no-reply@felegeyordanos.org>
    # Uploaded files in Cloudflare R2 (private buckets). R2_ENDPOINT and the
    # R2 access key are secrets (config/deploy.yml).
    STORAGE_DRIVER: s3
    R2_UPLOADS_BUCKET: felege-production-uploads
    R2_MEDIA_BUCKET: felege-production-media

# Receipts uploaded before R2. Kept until they are copied to the bucket
# (apps/web/scripts/copy-uploads-to-r2.mjs) and checked.
volumes:
  - felege-production-uploads:/data/uploads

accessories:
  # Container (and hostname on the kamal network): felege-db-production.
  # No published port: only containers on the server can reach it.
  # Nightly backups: felege-yordanos-infra, step "backups".
  db-production:
    image: postgres:17
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: felege
        POSTGRES_DB: felege
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - felege-production-pgdata:/var/lib/postgresql/data
    options:
      memory: 1g
