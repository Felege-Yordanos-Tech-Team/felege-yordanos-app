<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6B1D2A">
  <title>Offline — ፈለገ ዮርዳኖስ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFDF7;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #6B1D2A;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFDF7;
      font-size: 1.5rem;
      font-weight: bold;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #6B1D2A;
    }
    p {
      color: #666;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #6B1D2A;
      color: #FFFDF7;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">ፈ.ዮ.</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <p>ኢንተርኔት ግንኙነትዎን ያረጋግጡ።</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
