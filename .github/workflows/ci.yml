name: CI

# Runs on every pull request into dev or main, and on every push to dev.
# A PR can only be merged when this passes.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: felege
          POSTGRES_PASSWORD: felege
          POSTGRES_DB: felege
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U felege -d felege"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://felege:felege@localhost:5432/felege
      # CI-only values. Real secrets never go in this file.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      BETTER_AUTH_URL: http://localhost:3000
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Check schema changes have a migration
        # Fails when someone edited libs/db/src/schema but forgot `pnpm db:generate`.
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain libs/db/migrations)" ]; then
            echo "::error::The database schema changed but no migration was committed. Run 'pnpm db:generate' and commit the new file in libs/db/migrations."
            git status --porcelain libs/db/migrations
            exit 1
          fi

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publish to GitHub Container Registry (push to dev only)

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: felege
          POSTGRES_PASSWORD: felege
          POSTGRES_DB: felege
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U felege -d felege"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE: ghcr.io/felege-yordanos-tech-team/felege-yordanos-app
      DATABASE_URL: postgres://felege:felege@localhost:5432/felege
      # CI-only values. Real secrets never go in this file.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: felege-web:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrations, health check, sign-in page)
        run: |
          docker run --rm --network host -e DATABASE_URL felege-web:ci node db/scripts/migrate.mjs
          docker run -d --name web --network host \
            -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e EMAIL_TRANSPORT=console \
            felege-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/up && break
            sleep 2
          done
          curl -fsS http://localhost:3000/up
          curl -fsS -o /dev/null http://localhost:3000/login
          echo "Smoke test passed."

      - name: Container logs
        if: failure()
        run: docker logs web || true

      - name: Publish to GitHub Container Registry
        # Only after a merge into dev. Tags: the commit sha and "dev".
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$IMAGE:${GITHUB_SHA}" "$IMAGE:dev"; do
            docker tag felege-web:ci "$tag"
            docker push "$tag"
          done
